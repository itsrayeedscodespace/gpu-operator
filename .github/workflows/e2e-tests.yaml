---
name: E2E filtering fork validation
'on':
  workflow_call:
    inputs:
      skip_e2e:
        type: boolean
        default: false
      operator_image:
        required: true
        type: string
      operator_version:
        required: true
        type: string
      chart_reference:
        description: Published Helm chart to test instead of publishing one from this
          commit (set chart_version, and operator_version to its appVersion)
        required: false
        type: string
        default: ''
      chart_version:
        description: Version of chart_reference
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  variables:
    runs-on: ubuntu-latest
    steps:
    - run: echo CPU placeholder for variables
  publish-helm-oci-chart:
    needs:
    - variables
    if: "${{ !inputs.skip_e2e && !inputs.chart_reference }}"
    runs-on: ubuntu-latest
    steps:
    - run: echo CPU placeholder for publish-helm-oci-chart
  e2e-tests-containerd:
    needs:
    - variables
    - publish-helm-oci-chart
    if: "${{ !cancelled() && !inputs.skip_e2e && needs.variables.result == 'success'
      && (needs.publish-helm-oci-chart.result == 'success' || needs.publish-helm-oci-chart.result
      == 'skipped') }}"
    runs-on: ubuntu-latest
    steps:
    - run: echo CPU placeholder for e2e-tests-containerd
  e2e-tests-nvidiadriver:
    needs:
    - variables
    - publish-helm-oci-chart
    if: "${{ !cancelled() && !inputs.skip_e2e && needs.variables.result == 'success'
      && (needs.publish-helm-oci-chart.result == 'success' || needs.publish-helm-oci-chart.result
      == 'skipped') }}"
    runs-on: ubuntu-latest
    steps:
    - run: echo CPU placeholder for e2e-tests-nvidiadriver
